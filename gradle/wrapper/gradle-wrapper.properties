distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用腾讯云镜像分发 Gradle 发行包（与官方是同一份文件）。部分网络环境下 JDK 访问
# services.gradle.org 会因证书链不被信任而 PKIX 失败；要换回官方地址，把下面这行改成
# https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip 即可。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
